[package]
name = "kagg_env"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "_kagg_env"
crate-type = ["cdylib", "rlib"]

[dependencies]
half = "2.7"
numpy = { version = "0.29", features = ["half"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.bench]
codegen-units = 1
lto = "thin"
